<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snip: short links with click counts</title>
<style>
:root{--bg:#edf1f7;--ink:#0b1633;--mute:#5b6784;--line:#d3dae8;--card:#fff;--blue:#2b4bff;--hi:#ffd84d;--err:#c8303a;
--sans:"Avenir Next","Segoe UI",Helvetica,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
main{max-width:860px;margin:0 auto;padding:56px 20px 80px}
h1{font-size:clamp(2.6rem,8vw,5rem);line-height:.95;letter-spacing:-.04em;font-weight:800;margin:0 0 14px}
.sub{color:var(--mute);font-size:1.1rem;margin:0 0 36px;max-width:46ch}
form{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:10px;box-shadow:6px 6px 0 var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}
input{font:inherit;border:0;outline:0;background:transparent;color:var(--ink)}
#url{flex:1 1 280px;font-size:1.15rem;padding:14px 12px}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:9px;background:var(--blue);color:#fff;padding:14px 26px}
button:hover{background:#1c37d6}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.opts{display:flex;gap:10px;flex-wrap:wrap;padding:8px 6px 4px;border-top:1px solid var(--line);margin-top:6px}
.opts label{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:.9rem}
.opts input{border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:#f7f9fc}
#alias{width:170px;font-family:var(--mono)} #days{width:70px}
.err{color:var(--err);font-weight:600;margin:14px 4px 0;min-height:1.5em}
#result{display:none;margin-top:26px;background:var(--ink);color:#fff;border-radius:14px;padding:22px}
#result.show{display:block;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.short{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.short a{font-family:var(--mono);font-size:clamp(1.15rem,4vw,1.7rem);color:var(--hi);word-break:break-all;text-decoration:none}
.short a:hover{text-decoration:underline}
.copy{background:#fff;color:var(--ink);padding:9px 16px}.copy:hover{background:var(--hi)}
.cmp{margin-top:18px;font-size:.88rem;color:#aab4d4}
.track{height:10px;background:#26335e;border-radius:6px;margin-top:8px;overflow:hidden}
.fill{height:100%;width:100%;background:var(--hi);border-radius:6px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.stats{display:flex;justify-content:space-between;align-items:baseline;margin:54px 0 12px;flex-wrap:wrap;gap:6px}
.stats h2{margin:0;font-size:1.4rem;letter-spacing:-.02em}
.stats span{color:var(--mute);font-size:.95rem}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:8px}
.code{font-family:var(--mono);font-weight:700;color:var(--blue);text-decoration:none}
.orig{color:var(--mute);font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;grid-column:1}
.clicks{grid-row:1/3;grid-column:2;text-align:right;min-width:80px}
.clicks b{font-size:1.5rem;letter-spacing:-.03em}
.bar{height:4px;background:var(--line);border-radius:3px;margin-top:4px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.empty{color:var(--mute);border:2px dashed var(--line);border-radius:11px;padding:28px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Long links,<br>short.</h1>
  <p class="sub">Paste any link. Get a short one you can share, and see how many people open it.</p>

  <form id="f">
    <div class="row">
      <input id="url" type="url" placeholder="https://example.com/a/very/long/page?with=params" required aria-label="Link to shorten">
      <button id="go">Shorten link</button>
    </div>
    <div class="opts">
      <label>Custom name <input id="alias" placeholder="optional" maxlength="30"></label>
      <label>Expires in <input id="days" type="number" min="1" placeholder="never"> days</label>
    </div>
  </form>
  <div class="err" id="err" role="alert"></div>

  <section id="result" aria-live="polite">
    <div class="short"><a id="shortLink" target="_blank" rel="noopener"></a><button class="copy" id="copy" type="button">Copy link</button></div>
    <div class="cmp"><span id="cmpText"></span><div class="track"><div class="fill" id="fill"></div></div></div>
  </section>

  <div class="stats"><h2>Your links</h2><span id="totals"></span></div>
  <div id="list"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString();

async function load() {
  const links = await (await fetch('/api/links')).json();
  const max = Math.max(1, ...links.map(l => l.clicks));
  $('totals').textContent = `${links.length} links, ${fmt(links.reduce((s, l) => s + l.clicks, 0))} clicks`;
  const list = $('list'); list.replaceChildren();
  if (!links.length) { list.innerHTML = '<div class="empty">No links yet. Paste one above to create your first.</div>'; return; }
  links.forEach(l => {
    const d = document.createElement('div'); d.className = 'item';
    const a = document.createElement('a'); a.className = 'code'; a.href = l.shortUrl; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = l.shortUrl.replace(/^https?:\/\//, '');
    const o = document.createElement('div'); o.className = 'orig'; o.textContent = l.originalUrl; o.title = l.originalUrl;
    const c = document.createElement('div'); c.className = 'clicks';
    c.innerHTML = `<b>${fmt(l.clicks)}</b><div class="bar"><i style="width:${l.clicks / max * 100}%"></i></div>`;
    d.append(a, c, o); list.append(d);
  });
}

$('f').addEventListener('submit', async e => {
  e.preventDefault(); $('err').textContent = ''; $('go').disabled = true;
  try {
    const res = await fetch('/api/links', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: $('url').value.trim(), alias: $('alias').value.trim(), expiryDays: +$('days').value || null }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong. Try again.');
    showResult(data); $('f').reset(); load();
  } catch (err) { $('err').textContent = err.message; }
  $('go').disabled = false;
});

function showResult(l) {
  const r = $('result'); r.classList.add('show');
  $('shortLink').textContent = l.shortUrl; $('shortLink').href = l.shortUrl;
  const from = l.originalUrl.length, to = l.shortUrl.length, saved = Math.max(0, Math.round((1 - to / from) * 100));
  $('cmpText').textContent = `${from} characters down to ${to}` + (saved ? ` (${saved}% shorter)` : '');
  const f = $('fill'); f.style.transition = 'none'; f.style.width = '100%'; f.offsetWidth;
  f.style.transition = ''; f.style.width = Math.min(100, to / from * 100) + '%';
  $('copy').textContent = 'Copy link';
}
$('copy').addEventListener('click', async () => {
  await navigator.clipboard.writeText($('shortLink').textContent); $('copy').textContent = 'Copied';
});
load();
</script>
</body>
</html>
